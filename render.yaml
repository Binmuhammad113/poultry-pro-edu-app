services:
  - type: web
    name: poultrypro
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: poultrypro-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: poultrypro-db
    plan: free
    databaseName: poultrypro
    user: poultrypro
